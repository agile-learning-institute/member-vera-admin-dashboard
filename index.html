<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid">
        <div class="sidebar">
            <div class="logo-text">
                <img class="logo-img" src="./images/ic_dashboard_48px-512.webp" alt="logo-img">
                <h1>Dashboard</h1>
            </div>
            <div id="sidebar" class="list-items"></div>
        </div>
        <div class="main">
            <div class="header">
                <div class="navbar">
                    <svg class="list-items-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" /></svg>
                    <input type="text" class="form-input" >
                    <svg class="list-items-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M10 21H14C14 22.1 13.1 23 12 23S10 22.1 10 21M21 19V20H3V19L5 17V11C5 7.9 7 5.2 10 4.3V4C10 2.9 10.9 2 12 2S14 2.9 14 4V4.3C17 5.2 19 7.9 19 11V17L21 19M17 11C17 8.2 14.8 6 12 6S7 8.2 7 11V18H17V11Z" /></svg>
                    <img src="./images/cartoon-wizard-character-illustration-avatar-302224106.webp" alt="Profile Picture" width="40px" height="40px" class="navbarAvatar">
                    <h4>Morgan Oakley</h4>
                </div>    
                <div class="welcome">
                    <div class="left">
                        <img src="./images/cartoon-wizard-character-illustration-avatar-302224106.webp" alt="Profile Picture" width="50px" height="50px" class="welcomeAvatar"> 
                        <div class="welcome-text">
                            <p>Hi there,</p>
                            <h3>Morgan Oakley (@morgan)</h3>
                        </div>
                    </div>
                    <div class="right">
                        <button class="btn">New</button>
                        <button class="btn">Upload</button>
                        <button class="btn">Share</button>
                    </div>
                </div>
            </div>
            <div class="content">
                <div class="projects">
                    <h3>Your Projects</h3>
                    <div id="projectsCards"></div>
                </div>
                <div class="announcements-trends">World</div>
            </div>
        </div>
    </div>  
</body>
</html>
